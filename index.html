    .content{max-width:1450px;padding:30px 34px 60px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin:2px 0 23px}.eyebrow{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--green2);font-weight:700}.page-head h1{font-size:28px;line-height:1.2;margin:5px 0 7px;letter-spacing:-.7px}.page-head p{margin:0;color:var(--muted);max-width:650px;font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}

    .grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.stat,.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:17px 18px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{background:#eef4e8;color:var(--green);width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px}.dark .stat-icon{background:#314437;color:#c4e6b1}.stat strong{font-size:23px;display:block;margin:11px 0 2px;letter-spacing:-.4px}.stat small{color:var(--muted);font-size:11px}

    .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:520px}th{text-align:left;color:var(--muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;padding:9px 10px;border-bottom:1px solid var(--line)}td{font-size:12px;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}.product-mini{display:flex;align-items:center;gap:9px;min-width:130px}.mini-image{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#eef3e7;font-size:21px}.product-mini strong{display:block;font-size:12px}.product-mini small{display:block;color:var(--muted);font-size:10px}.price{font-weight:700}.badge{display:inline-flex;align-items:center;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:650;background:#edf5e9;color:#376645;white-space:nowrap}.badge.orange{background:#fff2df;color:#946126}.badge.gray{background:#f0f1ee;color:#717a72}.badge.red{background:#ffefec;color:#a44439}.dark .badge.gray{background:#374239;color:#cad2c9}.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}

    .crop-chip{display:inline-flex;background:var(--cream);border:1px solid var(--line);border-radius:20px;padding:6px 11px;font-size:11px;margin:3px;color:var(--muted)}.chart{width:100%;height:230px}.chart svg{width:100%;height:100%;overflow:visible}.chart-label{fill:var(--muted);font-size:10px}.notice{font-size:11px;color:var(--muted);margin:12px 0 0}
    .farmer-list{display:grid;gap:10px}.farmer-row{display:flex;align-items:center;gap:10px}.farmer-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#dfead5;font-size:18px}.farmer-row strong{font-size:12px;display:block}.farmer-row small{color:var(--muted);font-size:10px}.farmer-row .rating{margin-left:auto;font-size:11px;font-weight:700}

    .toast{position:fixed;right:22px;bottom:22px;z-index:30;background:#193e2c;color:white;border-radius:10px;padding:12px 16px;box-shadow:0 7px 30px #0003;font-size:12px;animation:up .2s ease}.hidden{display:none!important}@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
    .mobile-brand,.menu-toggle{display:none}
    @media(max-width:1100px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:760px){.sidebar{width:260px;transform:translateX(-100%);transition:transform .2s;box-shadow:12px 0 30px #0002}.sidebar.open{transform:none}.main{margin-left:0}.topbar{height:62px;padding:0 16px}.menu-toggle{display:inline-grid;place-items:center;border:0;background:transparent;color:var(--ink);font-size:22px;margin-right:10px}.crumb-wrap{display:flex;align-items:center}.content{padding:22px 15px 50px}.page-head h1{font-size:23px}.page-head{display:block}.page-head .actions{margin-top:14px}.hero{padding:23px 20px;min-height:210px}.hero h1{font-size:25px;max-width:90%}.hero:after{right:1px;bottom:-34px;font-size:120px}.two-col{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product-art{height:108px;font-size:43px}.product-body{padding:10px}.top-actions{gap:5px}.top-actions button{padding:7px 8px}.select-role{max-width:125px}.stats{gap:10px}.stat{padding:13px}.stat strong{font-size:20px}.card{padding:14px}}
    @media(max-width:390px){.products{grid-template-columns:1fr 1fr}.top-actions .hide-small{display:none}.stat-top{font-size:10px}.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}}

<div class="app">
  <aside class="sidebar" id="sidebar">

<script>
(() => {
  const KEY = "krishibondhu-demo-v1";
  const districts = ["Savar, Dhaka","Manikganj","Bogura","Rajshahi","Rangpur","Cumilla","Jashore","Mymensingh","Natore","Narsingdi"];
  const farmers = [
    ["f1","Ayesha Begum","Savar, Dhaka","👩🏽‍🌾",true,"Seasonal vegetables grown with care."],["f2","Rahim Uddin","Manikganj","👨🏽‍🌾",true,"Family rice and lentil farm."],["f3","Mina Akter","Bogura","👩🏽‍🌾",true,"Fresh produce from our village fields."],["f4","Jamal Hossain","Rajshahi","👨🏽‍🌾",false,"Fruit grower specializing in mangoes."],["f5","Shila Rani","Rangpur","👩🏽‍🌾",true,"Potatoes and winter vegetables."],["f6","Kamal Mia","Cumilla","👨🏽‍🌾",true,"Smallholder farmer growing local favorites."],["f7","Nasima Khatun","Jashore","👩🏽‍🌾",true,"Fresh greens and aromatic produce."],["f8","Babul Sarker","Mymensingh","👨🏽‍🌾",false,"Rice, beans and seasonal crops."],["f9","Farida Yasmin","Natore","👩🏽‍🌾",true,"A community farm for quality produce."],["f10","Sujan Das","Narsingdi","👨🏽‍🌾",true,"Growing vegetables for nearby families."]
  ].map(([id,name,location,avatar,verified,about],i)=>({id,name,location,avatar,verified,about,rating:[4.9,4.7,4.8,4.6,4.9,4.7,4.8,4.5,4.8,4.7][i]}));
  const baseProducts = [
    ["p1","Miniket Rice","Grains","f2",62,58,900,"kg","🍚"],["p2","Fresh Tomatoes","Vegetables","f1",42,36,260,"kg","🍅"],["p3","Farm Potatoes","Vegetables","f5",32,28,1200,"kg","🥔"],["p4","Red Onions","Vegetables","f3",78,70,480,"kg","🧅"],["p5","Purple Brinjal","Vegetables","f6",48,41,180,"kg","🍆"],["p6","Cauliflower","Vegetables","f10",38,32,220,"piece","🥦"],["p7","Green Cabbage","Vegetables","f5",30,25,350,"piece","🥬"],["p8","Green Chilies","Vegetables","f7",110,98,90,"kg","🌶️"],["p9","Fresh Spinach","Vegetables","f7",26,22,140,"bundle","🥬"],["p10","Deshi Mango","Fruits","f4",95,82,380,"kg","🥭"],["p11","Sweet Bananas","Fruits","f8",55,47,300,"dozen","🍌"],["p12","Masoor Lentils","Pulses","f2",115,102,200,"kg","🫘"],["p13","Green Beans","Vegetables","f3",60,52,170,"kg","🫛"],["p14","Local Garlic","Spices","f9",145,130,110,"kg","🧄"],["p15","Fresh Pumpkin","Vegetables","f6",35,29,400,"kg","🎃"],["p16","Sweet Papaya","Fruits","f1",45,38,250,"kg","🍈"],["p17","Red Amaranth","Vegetables","f7",24,20,110,"bundle","🌿"],["p18","Aromatic Rice","Grains","f8",88,78,300,"kg","🍚"],["p19","Green Peas","Pulses","f5",75,66,170,"kg","🫛"],["p20","Fresh Ginger","Spices","f9",125,112,140,"kg","🫚"],["p21","Country Eggs","Other","f10",14,12,240,"piece","🥚"],["p22","Fresh Lemon","Fruits","f6",60,52,180,"piece","🍋"],["p23","Sweet Corn","Vegetables","f3",35,29,300,"piece","🌽"],["p24","Red Spinach","Vegetables","f1",28,23,160,"bundle","🌿"]
  ].map(([id,name,category,farmerId,retail,wholesale,stock,unit,emoji],i)=>({id,name,category,farmerId,price:retail,retail,wholesale,stock,unit,emoji,available:true,minimum:category==="Grains"||category==="Pulses"?10:2,harvest:"Recently harvested",quality:"Freshly picked from the farm.",organic:i%5===1}));
  const priceCrops = ["Rice","Tomato","Potato","Onion","Brinjal","Mango","Lentil","Green chili"];
  const marketNames = [["Karwan Bazar","Dhaka"],["Savar Bazar","Dhaka"],["Bogura Sadar","Bogura"],["Rajshahi City Market","Rajshahi"],["Rangpur Central Market","Rangpur"]];
  const priceBase = {Rice:61,Tomato:40,Potato:31,Onion:76,Brinjal:46,Mango:92,Lentil:112,"Green chili":108};
  const marketPrices = [];
  priceCrops.forEach((crop,ci)=>marketNames.forEach(([market,district],mi)=>{
    const base=priceBase[crop]+((ci*7+mi*5)%13)-6;
    const history=Array.from({length:7},(_,i)=>Math.max(10,base+((i*3+mi*2+ci)%9)-4));
    marketPrices.push({crop,market,district,price:base,unit:"kg",date:"2026-11-02",source:"Sample simulation",history});
  }));
  const customers = [["c1","Nusrat Jahan","Dhaka","Household"],["c2","Tanvir Ahmed","Dhaka","Restaurant"],["c3","Maliha Chowdhury","Savar","Household"],["c4","Green Basket Shop","Bogura","Grocery shop"],["c5","Rafiq Hasan","Cumilla","Household"],["c6","Village Kitchen","Rajshahi","Restaurant"],["c7","Sadia Islam","Rangpur","Household"],["c8","Fresh Mart","Mymensingh","Grocery shop"]].map(([id,name,district,type])=>({id,name,district,type}));
  const orderSeeds = [
    ["o1","p2","c1",4,"Retail","Pending"],["o2","p1","c2",60,"Wholesale","Accepted"],["o3","p3","c4",80,"Wholesale","Preparing"],["o4","p10","c6",12,"Retail","Shipped"],["o5","p4","c3",5,"Retail","Delivered"],["o6","p5","c5",8,"Retail","Delivered"],["o7","p8","c7",10,"Wholesale","Pending"],["o8","p12","c2",25,"Wholesale","Delivered"],["o9","p6","c1",6,"Retail","Cancelled"],["o10","p11","c8",30,"Wholesale","Accepted"],["o11","p9","c3",3,"Retail","Preparing"],["o12","p18","c4",45,"Wholesale","Delivered"],["o13","p14","c5",4,"Retail","Pending"],["o14","p13","c6",18,"Wholesale","Shipped"],["o15","p21","c1",24,"Retail","Delivered"]
  ];
  const partnerSeeds=[["d1","Hasan Ali","01700-000001","Dhaka"],["d2","Rina Sultana","01700-000002","Bogura"],["d3","Mizanur Rahman","01700-000003","Rajshahi"],["d4","Sumi Akter","01700-000004","Cumilla"],["d5","Alamgir Kabir","01700-000005","Rangpur"]];
  function initialData(){
    const products=structuredClone(baseProducts);
    const orders=orderSeeds.map(([id,productId,customerId,qty,type,status],i)=>{
      const p=products.find(x=>x.id===productId);
      const stockReserved=["Accepted","Preparing","Shipped"].includes(status);
      if(!["Pending","Cancelled"].includes(status))p.stock=Math.max(0,p.stock-qty);
      return{id,productId,farmerId:p.farmerId,customerId,qty,type,status,stockReserved,payment:status==="Delivered"?"Paid":["Paid","Pending","Paid"][i%3],delivery:["Platform Delivery","Farmer Delivery","Customer Pickup"][i%3],deliveryStatus:status==="Delivered"?"Delivered":status==="Shipped"?"In Transit":"Awaiting Assignment",date:new Date(Date.UTC(2026,9,3+i)).toISOString().slice(0,10),price:type==="Wholesale"?p.wholesale:p.retail};
    });
    return {farmers:structuredClone(farmers),products,customers:structuredClone(customers),
      orders,
      partners:partnerSeeds.map(([id,name,phone,area],i)=>({id,name,phone,area,status:["Assigned","Available","In Transit","Available","Assigned"][i]})),marketPrices:structuredClone(marketPrices),
      notifications:[{id:"n1",text:"A new order is waiting for review.",type:"New order",read:false},{id:"n2",text:"Your sample order has been accepted.",type:"Order update",read:false},{id:"n3",text:"Market price sample records were updated.",type:"Price update",read:true},{id:"n4",text:"Delivery partner Hasan Ali was assigned.",type:"Delivery",read:true},{id:"n5",text:"Sample payment marked complete.",type:"Payment",read:true}],
      reviews:[{farmerId:"f1",customer:"Nusrat Jahan",rating:5,text:"Fresh tomatoes and friendly service."},{farmerId:"f5",customer:"Green Basket Shop",rating:5,text:"Great quality potatoes, delivered on time."},{farmerId:"f4",customer:"Village Kitchen",rating:4,text:"Lovely seasonal mangoes."}],
      cart:[],favorites:[],language:"en",dark:false};
  }
  function loadData(){try{const raw=localStorage.getItem(KEY);if(raw){const saved=JSON.parse(raw);return {...initialData(),...saved}}}catch(e){console.warn("Could not load saved demo data:",e)}return initialData()}

  function renderCalculator(){
    return `${pageHead("Farmer earnings calculator","Compare wholesale and direct-selling estimates. Revenue is not the same as net earnings.")}<div class="banner">ⓘ This calculator provides estimates only. Enter realistic costs for your own situation; demo results are not a price guarantee.</div>
    <div class="grid two-col"><section class="card"><div class="card-head"><div><h2>Estimate your earnings</h2><p>Change an input to update the comparison</p></div></div><div class="form-grid"><label class="span2">Crop name<input id="calcCrop" value="Tomato"></label><label>Quantity (kg)<input id="calcQty" type="number" value="100" min="0"></label><label>Wholesale price / kg (৳)<input id="calcWholesale" type="number" value="34" min="0"></label><label>Direct selling price / kg (৳)<input id="calcDirect" type="number" value="42" min="0"></label><label>Delivery cost (৳)<input id="calcDelivery" type="number" value="450" min="0"></label><label>Packaging cost (৳)<input id="calcPackaging" type="number" value="250" min="0"></label><label>Other expenses (৳)<input id="calcOther" type="number" value="150" min="0"></label></div></section>
    <section class="card"><div class="card-head"><div><h2>Estimated comparison</h2><p>Gross revenue minus selling expenses</p></div></div><div id="calcResults"></div></section></div>`;
  }
  function updateCalculator(){
    const val=id=>Math.max(0,Number(document.getElementById(id)?.value||0)),qty=val("calcQty"),wh=val("calcWholesale"),direct=val("calcDirect"),delivery=val("calcDelivery"),pack=val("calcPackaging"),other=val("calcOther");
    const expenses=delivery+pack+other,whGross=qty*wh,directGross=qty*direct,whNet=whGross-expenses,directNet=directGross-expenses,diff=directNet-whNet;
    const el=document.getElementById("calcResults");if(el)el.innerHTML=`<div class="calc-result"><div class="calc-box"><small>Wholesale gross revenue</small><strong>${money(whGross)}</strong></div><div class="calc-box"><small>Direct gross revenue</small><strong>${money(directGross)}</strong></div></div><div class="calc-result"><div class="calc-box"><small>Total selling expenses</small><strong>${money(expenses)}</strong></div><div class="calc-box"><small>Wholesale net estimate</small><strong>${money(whNet)}</strong></div></div><div class="calc-box" style="margin-top:12px;background:#e8f2e0"><small>Direct net estimate · difference vs wholesale</small><strong>${money(directNet)} <span style="font-size:12px;color:var(--green2)">(${diff>=0?"+":""}${money(diff)})</span></strong></div><p class="notice">Net estimate = gross revenue − delivery − packaging − other expenses. Actual costs and sale terms vary.</p>`;
  }
  function renderAdmin(){
    const m=getMetrics();
    return `${pageHead("Admin & demo settings","Review sample marketplace activity, manage simulated records and reset this browser's demo data.",`<button class="btn danger" id="resetAdmin">↻ Reset demo data</button>`)}
    <div class="banner">🛡 Admin portal is a prototype view only; it has no authentication or real role-based access control. Do not enter real personal or payment data.</div>
    <div class="grid stats">${stat("Demo farmers",state.farmers.length,"Fictional profiles","♙")}${stat("Demo customers",state.customers.length,"Fictional profiles","♧")}${stat("Products",state.products.length,"Local demo listings","▦")}${stat("Orders",m.orders,"Local demo records","▤")}</div>
    <div class="grid two-col"><section class="card"><div class="card-head"><div><h2>Farmer verification</h2><p>Example review queue for the admin prototype</p></div></div><div class="table-wrap"><table><thead><tr><th>Farmer</th><th>Location</th><th>Status</th><th></th></tr></thead><tbody>${state.farmers.map(f=>`<tr><td>${f.avatar} <strong>${esc(f.name)}</strong></td><td>${esc(f.location)}</td><td>${statusBadge(f.verified?"Verified":"Review needed")}</td><td><button class="btn small ${f.verified?"secondary":"light"}" data-verify="${f.id}">${f.verified?"Unverify":"Verify"}</button></td></tr>`).join("")}</tbody></table></div></section>
    <section class="card"><div class="card-head"><div><h2>Add sample market record</h2><p>Manually entered demo prices are clearly labeled</p></div></div><form id="priceForm" class="form-grid"><label>Crop<input name="crop" required placeholder="e.g. Tomato"></label><label>Market<input name="market" required placeholder="Market name"></label><label>District<input name="district" required placeholder="District"></label><label>Price (৳/kg)<input name="price" type="number" min="1" required></label><button class="btn span2">Add sample price</button></form></section></div>
    <section class="card" style="margin-top:15px"><div class="card-head"><div><h2>Demo data controls</h2><p>Everything is stored locally in this browser only.</p></div></div><div class="actions"><button class="btn secondary" data-go="market">Browse as customer</button><button class="btn secondary" data-go="farmer">Open farmer tools</button><button class="btn secondary" data-go="prices">Review sample prices</button></div><p class="notice">External integrations that would need setup: Firebase authentication and Firestore, payment providers, verified market feeds, delivery partners, SMS and weather services.</p></section>`;
  }
  function render(){
    document.body.classList.toggle("dark",!!state.dark);
    document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
    const title={home:"Overview",market:"Marketplace",prices:"Market prices",farmer:"Farmer portal",orders:"Orders",delivery:"Delivery",calculator:"Earnings calculator",admin:"Admin & demo settings"}[page]||"Overview";
    document.getElementById("crumbTitle").textContent=title;
    document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n)});
    document.getElementById("langToggle").textContent=state.language==="en"?"বাংলা":"English";
    document.getElementById("themeToggle").textContent=state.dark?"☀":"☾";
    const views={home:renderHome,market:renderMarketplace,prices:renderPrices,farmer:renderFarmer,orders:renderOrders,delivery:renderDelivery,calculator:renderCalculator,admin:renderAdmin};
    content.innerHTML=(views[page]||renderHome)();
    bindContent();
    if(page==="farmer")buyerComparison();
    if(page==="calculator")updateCalculator();
  }
  function bindContent(){
    content.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>setPage(b.dataset.go));
    content.querySelectorAll("[data-add-cart]").forEach(b=>b.onclick=()=>addCart(b.dataset.addCart));
    content.querySelectorAll("[data-favorite]").forEach(b=>b.onclick=()=>{const id=b.dataset.favorite;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();render()});
    content.querySelectorAll("[data-order-action]").forEach(b=>b.onclick=()=>changeOrder(b.dataset.id,b.dataset.orderAction));
    content.querySelectorAll("[data-toggle-product]").forEach(b=>b.onclick=()=>{const p=product(b.dataset.toggleProduct);p.available=!p.available;save();render()});
    content.querySelectorAll("[data-edit-product]").forEach(b=>b.onclick=()=>openProductForm(product(b.dataset.editProduct)));
    content.querySelectorAll("[data-remove-cart]").forEach(b=>b.onclick=()=>{state.cart=state.cart.filter(x=>x.productId!==b.dataset.removeCart);save();render()});
    content.querySelectorAll("[data-cart-qty]").forEach(i=>i.onchange=()=>{const item=state.cart.find(x=>x.productId===i.dataset.cartQty),p=product(i.dataset.cartQty);if(item&&p){item.qty=Math.max(1,Math.min(p.stock,Number(i.value)||1));save();render()}});
    content.querySelectorAll("[data-verify]").forEach(b=>b.onclick=()=>{const f=farmer(b.dataset.verify);f.verified=!f.verified;save();render()});
    const add=document.getElementById("addProductBtn");if(add)add.onclick=()=>openProductForm();
    const crop=document.getElementById("cropSelect");if(crop)crop.onchange=()=>{selectedCrop=crop.value;render()};
    const buyerInputs=["buyerCrop","buyerQty","buyerDelivery","buyerOther"].map(id=>document.getElementById(id)).filter(Boolean);buyerInputs.forEach(i=>i.oninput=buyerComparison);
    ["calcQty","calcWholesale","calcDirect","calcDelivery","calcPackaging","calcOther","calcCrop"].forEach(id=>{const el=document.getElementById(id);if(el)el.oninput=updateCalculator});
    const pf=document.getElementById("priceForm");if(pf)pf.onsubmit=addPrice;
    const reset=document.getElementById("resetAdmin");if(reset)reset.onclick=resetDemo;
    const checkout=document.getElementById("checkoutBtn"),checkout2=document.getElementById("checkoutBtn2");if(checkout)checkout.onclick=checkoutCart;if(checkout2)checkout2.onclick=checkoutCart;
    content.querySelectorAll("[data-delivery-order]").forEach(s=>s.onchange=()=>{const o=state.orders.find(x=>x.id===s.dataset.deliveryOrder);if(o)o.partnerId=s.value||undefined;save()});
    content.querySelectorAll("[data-delivery-next]").forEach(b=>b.onclick=()=>advanceDelivery(b.dataset.deliveryNext));
    const search=document.getElementById("productSearch");if(search)search.oninput=()=>{searchTerm=search.value;const cursor=search.selectionStart;document.getElementById("productGrid").innerHTML=renderFilteredProducts();const next=document.getElementById("productSearch");if(next){next.focus();next.setSelectionRange(cursor,cursor);bindProductCards()}};
    const cat=document.getElementById("categoryFilter");if(cat)cat.onchange=()=>{categoryFilter=cat.value;render()};
    const district=document.getElementById("districtFilter");if(district)district.onchange=()=>{const d=district.value;searchTerm=d;render()};
  }
  function renderFilteredProducts(){let ps=state.products.filter(p=>p.available&&p.stock>0);if(searchTerm)ps=ps.filter(p=>(p.name+" "+p.category+" "+farmer(p.farmerId).location).toLowerCase().includes(searchTerm.toLowerCase()));if(categoryFilter!=="All")ps=ps.filter(p=>p.category===categoryFilter);return ps.length?ps.map(productCard).join(""):`<div class="empty">No products match your search.</div>`}
  function bindProductCards(){content.querySelectorAll("[data-add-cart]").forEach(b=>b.onclick=()=>addCart(b.dataset.addCart));content.querySelectorAll("[data-favorite]").forEach(b=>b.onclick=()=>{const id=b.dataset.favorite;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();render()})}
  function addCart(id){const p=product(id);if(!p||!p.available||p.stock<1){toast("This sample listing is unavailable.");return}const item=state.cart.find(x=>x.productId===id);if(item)item.qty=Math.min(p.stock,item.qty+1);else state.cart.push({productId:id,qty:1});save();toast(`${p.name} added to demo cart.`);if(page==="market")render()}
  function checkoutCart(){
    if(!state.cart.length){toast("Add a product to your demo cart first.");return}
    const rows=state.cart.map(i=>{const p=product(i.productId);return p?`<div>${esc(p.name)} · ${i.qty} ${esc(p.unit)} · ${money(p.retail*i.qty)}</div>`:""}).join("");
    showModal("Demo checkout",`<div class="banner">This creates a simulated order only. No payment or delivery service is connected.</div><div class="form-grid"><label class="span2">Delivery address<input id="checkoutAddress" required value="Savar, Dhaka"></label><label>Buying type<select id="checkoutType"><option>Retail</option><option>Wholesale</option></select></label><label>Delivery method<select id="checkoutDelivery"><option>Platform Delivery</option><option>Farmer Delivery</option><option>Customer Pickup</option></select></label><label class="span2">Payment method<select id="checkoutPayment"><option>Cash on delivery (demo)</option><option>Demo payment placeholder</option></select></label></div><div style="margin:15px 0;font-size:12px;line-height:2">${rows}</div><button class="btn" id="placeOrderBtn" style="width:100%">Place simulated order</button>`);
    document.getElementById("placeOrderBtn").onclick=()=>{
      const address=document.getElementById("checkoutAddress").value.trim();if(!address){toast("Enter a delivery address.");return}
      const type=document.getElementById("checkoutType").value,delivery=document.getElementById("checkoutDelivery").value;
      for(const item of state.cart){const p=product(item.productId);if(!p||p.stock<item.qty){toast(`${p?.name||"A product"} no longer has enough sample stock.`);return}if(type==="Wholesale"&&item.qty<p.minimum){toast(`${p.name} requires a wholesale minimum of ${p.minimum} ${p.unit}.`);return}}
      for(const item of state.cart){const p=product(item.productId),id="o"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);state.orders.push({id,productId:p.id,farmerId:p.farmerId,customerId:"c1",qty:item.qty,type,status:"Pending",payment:"Pending",delivery,deliveryStatus:"Awaiting Assignment",address,date:new Date().toISOString().slice(0,10),price:type==="Wholesale"?p.wholesale:p.retail})}
      state.cart=[];state.notifications.unshift({id:"n"+Date.now(),text:"A new simulated order was placed.",type:"New order",read:false});save();closeModal();toast("Simulated order placed. No payment was taken.");render();
    };
  }
  function changeOrder(id,action){
    const o=state.orders.find(x=>x.id===id),p=o&&product(o.productId);if(!o)return;
    if(action==="accept"){if(!p||p.stock<o.qty){toast("Not enough available stock to accept this order.");return}p.stock-=o.qty;o.stockReserved=true;o.status="Accepted";o.payment="Pending"}
    else if(action==="prepare"){if(o.status==="Accepted")o.status="Preparing"}
    else if(action==="ship"){if(o.status==="Preparing"){o.status="Shipped";o.deliveryStatus="In Transit"}}
    else if(action==="deliver"){if(o.status==="Shipped"){o.status="Delivered";o.deliveryStatus="Delivered";o.payment="Paid"}}
    else if(action==="cancel"){if(o.stockReserved&&p){p.stock+=o.qty;o.stockReserved=false}o.status="Cancelled"}
    state.notifications.unshift({id:"n"+Date.now(),text:`Order ${id.toUpperCase()} status updated: ${o.status}.`,type:"Order update",read:false});
    save();render();toast(`Order ${o.status.toLowerCase()}.`);
  }
  function advanceDelivery(id){
    const o=state.orders.find(x=>x.id===id);if(!o)return;
    if(["Pending","Cancelled"].includes(o.status)){toast("Accept this order before starting delivery.");return}
    if(!o.partnerId){const sel=document.querySelector(`[data-delivery-order="${id}"]`);if(sel?.value)o.partnerId=sel.value;else{toast("Assign a demo delivery partner first.");return}}
    const statuses=["Awaiting Assignment","Assigned","Picked Up","In Transit","Delivered"];
    const next=statuses[Math.min(statuses.indexOf(o.deliveryStatus)+1,statuses.length-1)];o.deliveryStatus=next;
    if(next==="Picked Up")o.status="Shipped";
    if(next==="Delivered"){o.status="Delivered";o.payment="Paid"}
    save();render();toast(`Demo delivery updated: ${next}.`);
  }
  function openProductForm(p){
    const editing=!!p;showModal(editing?"Edit crop listing":"List a new crop",`<form id="productForm" class="form-grid">
      <label>Crop name<input name="name" required value="${esc(p?.name||"")}"></label><label>Category<select name="category">${["Grains","Vegetables","Fruits","Pulses","Spices","Other"].map(c=>`<option ${p?.category===c?"selected":""}>${c}</option>`).join("")}</select></label>
      <label>Available quantity<input name="stock" type="number" min="0" required value="${p?.stock??100}"></label><label>Unit<select name="unit">${["kg","bag","ton","bundle","piece","dozen"].map(u=>`<option ${p?.unit===u?"selected":""}>${u}</option>`).join("")}</select></label>
      <label>Retail price (৳/unit)<input name="retail" type="number" min="1" required value="${p?.retail??40}"></label><label>Wholesale price<input name="wholesale" type="number" min="1" required value="${p?.wholesale??35}"></label>
      <label>Minimum order<input name="minimum" type="number" min="1" value="${p?.minimum??2}"></label><label>Harvest date<input name="harvest" value="${esc(p?.harvest||"Recently harvested")}"></label>
      <label class="span2">Quality description<textarea name="quality">${esc(p?.quality||"Freshly picked from the farm.")}</textarea></label><label>Organic listing<select name="organic"><option value="false">No</option><option value="true" ${p?.organic?"selected":""}>Yes</option></select></label>
      <button class="btn span2">${editing?"Save listing":"Add sample listing"}</button></form>`);
    document.getElementById("productForm").onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),retail=Number(fd.get("retail")),wholesale=Number(fd.get("wholesale"));if(retail<=0||wholesale<=0){toast("Prices must be greater than zero.");return}
      const data={name:fd.get("name").trim(),category:fd.get("category"),stock:Number(fd.get("stock")),unit:fd.get("unit"),retail,price:retail,wholesale,minimum:Number(fd.get("minimum"))||1,harvest:fd.get("harvest"),quality:fd.get("quality").trim(),organic:fd.get("organic")==="true",available:true,emoji:p?.emoji||"🌱",farmerId:"f1"};
      if(editing)Object.assign(p,data);else state.products.unshift({...data,id:"p"+Date.now().toString(36)});
      save();closeModal();render();toast(editing?"Crop listing updated.":"Crop added to demo marketplace.");
    };
  }
  function addPrice(e){e.preventDefault();const fd=new FormData(e.target),crop=fd.get("crop").trim(),price=Number(fd.get("price"));if(!crop||price<=0){toast("Enter a crop and a valid price.");return}
    const history=Array.from({length:7},(_,i)=>Math.max(1,price+((i*3)%7)-3));state.marketPrices.unshift({crop,market:fd.get("market").trim(),district:fd.get("district").trim(),price,unit:"kg",date:new Date().toISOString().slice(0,10),source:"Manually entered sample",history});if(!priceCrops.includes(crop))priceCrops.push(crop);save();render();toast("Sample market record added.");
  }
  function showModal(title,html){document.getElementById("modalHost").innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button class="close" id="closeModal" aria-label="Close">×</button></div>${html}</div></div>`;document.getElementById("closeModal").onclick=closeModal;document.getElementById("modalBackdrop").onclick=e=>{if(e.target.id==="modalBackdrop")closeModal()}}
  function closeModal(){document.getElementById("modalHost").innerHTML=""}
  function toast(text){const host=document.getElementById("toastHost");host.innerHTML=`<div class="toast">${esc(text)}</div>`;setTimeout(()=>host.innerHTML="",2600)}
  function resetDemo(){if(!confirm("Reset all locally saved demo changes and restore the sample data?"))return;localStorage.removeItem(KEY);state=initialData();searchTerm="";categoryFilter="All";selectedCrop="Tomato";save();setPage("home");toast("Demo data reset in this browser.")}
  document.getElementById("mainNav").addEventListener("click",e=>{const b=e.target.closest("[data-page]");if(b)setPage(b.dataset.page)});
  document.getElementById("menuToggle").onclick=()=>document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("roleSelect").onchange=e=>{role=e.target.value;setPage(role==="farmer"?"farmer":role==="admin"?"admin":"market");toast(`${role[0].toUpperCase()+role.slice(1)} demo view opened.`)};
  document.getElementById("langToggle").onclick=()=>{state.language=state.language==="en"?"bn":"en";save();render()};
  document.getElementById("themeToggle").onclick=()=>{state.dark=!state.dark;save();render()};
  document.getElementById("notifyBtn").onclick=()=>{const unread=state.notifications.filter(n=>!n.read);showModal("Demo notifications",unread.length?`<div class="farmer-list">${state.notifications.map(n=>`<div class="farmer-row"><div class="farmer-avatar">${n.type==="Delivery"?"🚲":n.type==="Price update"?"📈":"🔔"}</div><div><strong>${esc(n.type)}</strong><small>${esc(n.text)}</small></div>${n.read?"":'<span class="badge orange">New</span>'}</div>`).join("")}</div><button class="btn" id="readNotifs" style="margin-top:15px">Mark all as read</button>`:`<div class="empty">You are all caught up.</div>`);const b=document.getElementById("readNotifs");if(b)b.onclick=()=>{state.notifications.forEach(n=>n.read=true);save();closeModal();toast("Notifications marked as read.")}};
  document.getElementById("resetSide").onclick=resetDemo;
  render();
})();
</script>
</body>
</html>
